<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduManage - School Management System</title>
    <meta name="description" content="Comprehensive school management software featuring distinct panels for Admins, Teachers, Students, and Clerks. Covers homework, test/exam results, fee management, and support ticketing." />
    <meta property="og:title" content="EduManage - School Management System" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clean up any stale/broken service workers that could cause blank screens on public URL
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        }).catch(function() {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
